[workspace]
members = [
    "crates/concord-protocol",
    "crates/concord-harness",
    "crates/concord-kernel",
    "crates/concord-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/California-Synthetic/concord"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.10"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
concord-harness = { path = "crates/concord-harness" }
concord-protocol = { path = "crates/concord-protocol" }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1.18", features = ["v4"] }
epact-compiler = { git = "https://github.com/California-Synthetic/epact.git", rev = "715b1f29323523e56f497573fb5b60692ec393ee" }
epact-protocol = { git = "https://github.com/California-Synthetic/epact.git", rev = "715b1f29323523e56f497573fb5b60692ec393ee" }
epact-runtime = { git = "https://github.com/California-Synthetic/epact.git", rev = "715b1f29323523e56f497573fb5b60692ec393ee" }
