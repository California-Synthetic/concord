[workspace]
members = ["crates/concord-protocol", "crates/concord-harness"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/California-Synthetic/concord"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
epact-compiler = { git = "ssh://git@github.com/California-Synthetic/epact.git", rev = "597c892e7ca4c2652a2a308b08c70711b05164ff" }
epact-protocol = { git = "ssh://git@github.com/California-Synthetic/epact.git", rev = "597c892e7ca4c2652a2a308b08c70711b05164ff" }
epact-runtime = { git = "ssh://git@github.com/California-Synthetic/epact.git", rev = "597c892e7ca4c2652a2a308b08c70711b05164ff" }
